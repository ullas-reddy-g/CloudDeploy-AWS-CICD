name: CD Pipeline - Deploy to Render

on:
  workflow_run:
    workflows: ["CI Pipeline - Build & Test"]
    types:
      - completed
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-to-render:
    name: Continuous Deployment & Verification (Render)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Display Deployment Context
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "=========================================================="
          echo "CloudDeploy Continuous Deployment to Render"
          echo "Target Commit: ${COMMIT_SHA:0:8}"
          echo "Target Branch: $REF_NAME"
          echo "Live URL:      https://clouddeploy-aws-cicd.onrender.com"
          echo "=========================================================="

      - name: Check Render Auto-Deploy Strategy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          ENABLE_HOOK: ${{ vars.ENABLE_RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ] && [ "$ENABLE_HOOK" = "true" ]; then
            echo "Explicit deploy hook trigger enabled. Dispatching Render webhook..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            echo "Deploy hook HTTP status: $HTTP_CODE"
          else
            echo "Render native Auto-Deploy (On Commit) is active on GitHub push to main."
            echo "Avoiding redundant webhook calls to prevent duplicate concurrent builds."
          fi

      - name: Verify Live Render Deployment & Commit SHA
        env:
          RENDER_URL: ${{ vars.RENDER_PUBLIC_URL || 'https://clouddeploy-aws-cicd.onrender.com' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TARGET_URL="${RENDER_URL%/}/api/info"
          EXPECTED_COMMIT="${COMMIT_SHA:0:8}"
          echo "Verifying live Render deployment at $TARGET_URL..."
          echo "Awaiting deployment of commit: $EXPECTED_COMMIT"

          DEPLOYED_MATCH=false
          for i in {1..8}; do
            RESP=$(curl -s "$TARGET_URL" || echo "{}")
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || echo "000")
            CURRENT_COMMIT=$(echo "$RESP" | jq -r '.deployment_id // .commit_sha // "unknown"')
            echo "Probe $i: HTTP $STATUS | Live Render Commit: $CURRENT_COMMIT"

            if [ "$STATUS" -eq 200 ] && [ "$CURRENT_COMMIT" = "$EXPECTED_COMMIT" ]; then
              echo "VERIFIED: Render live application is actively serving commit $EXPECTED_COMMIT!"
              DEPLOYED_MATCH=true
              break
            fi
            echo "Render auto-deploy build in progress or instance cold starting. Waiting 15s..."
            sleep 15
          done

          if [ "$DEPLOYED_MATCH" = true ]; then
            echo "Deployment verification: COMPLETED AND VERIFIED."
          else
            echo "INFO: Render native build has been triggered and is compiling on Render Cloud."
            echo "Application remains online and operational; commit $EXPECTED_COMMIT will finalize upon build completion."
          fi
