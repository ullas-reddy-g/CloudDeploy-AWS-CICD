{% extends "base.html" %}

{% block title %}404 - Resource Not Found | CloudDeploy{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6 text-center">
        <div class="p-5 rounded-4 bg-surface border border-secondary shadow-lg">
            <div class="display-1 fw-bold text-danger mb-3">404</div>
            <h3 class="text-white fw-bold mb-3">Page or Endpoint Not Found</h3>
            <p class="text-secondary mb-4">
                The requested resource <code class="text-warning">{{ path }}</code> does not exist on this CloudDeploy server or has been relocated.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">
                    <i class="bi bi-house-door me-2"></i> Return to Dashboard
                </a>
                <a href="/health" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-heart-pulse me-2"></i> Health Probe
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
