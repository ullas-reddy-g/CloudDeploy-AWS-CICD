services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: clouddeploy:latest
    container_name: clouddeploy-web
    restart: unless-stopped
    environment:
      - APP_NAME=CloudDeploy
      - APP_VERSION=1.0.0
      - ENVIRONMENT=production
      - DEPLOYMENT_ID=compose-local
      - AWS_REGION=us-east-1
      - PORT=8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).getcode() == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - clouddeploy-net

  nginx:
    image: nginx:alpine
    container_name: clouddeploy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - clouddeploy-net

networks:
  clouddeploy-net:
    driver: bridge
