name: CI Pipeline - Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code Quality & Style Lint (flake8)
        run: |
          # Stop build if syntax errors or undefined names exist
          flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce PEP8 formatting standards
          flake8 app/ tests/ --count --max-line-length=120 --statistics

      - name: Execute Automated Test Suite (Pytest)
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80

  docker-build:
    name: Container Build Verification
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: clouddeploy:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
