name: CD Pipeline - Deploy to Render

on:
  workflow_run:
    workflows: ["CI Pipeline - Build & Test"]
    types:
      - completed
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-to-render:
    name: Continuous Deployment & Verification (Render)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Display Deployment Context
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "=========================================================="
          echo "CloudDeploy Continuous Deployment to Render"
          echo "Commit SHA:    ${COMMIT_SHA:0:8}"
          echo "Target Branch: $REF_NAME"
          echo "Live URL:      https://clouddeploy-aws-cicd.onrender.com"
          echo "=========================================================="

      - name: Trigger Render Deploy Hook (If Configured)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret detected. Triggering Render deployment via secured webhook..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "Deploy hook HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Render deploy hook accepted successfully."
            else
              echo "WARNING: Deploy hook returned HTTP $HTTP_CODE: $BODY"
            fi
          else
            echo "RENDER_DEPLOY_HOOK secret is not set in repository secrets."
            echo "Render's native Git-push integration automatically triggers deployment on push to main."
            echo "No manual hook trigger required."
          fi

      - name: Verify Live Render Application Health Check
        env:
          RENDER_URL: ${{ vars.RENDER_PUBLIC_URL || 'https://clouddeploy-aws-cicd.onrender.com' }}
        run: |
          TARGET_URL="${RENDER_URL%/}/health"
          echo "Probing live Render application health at $TARGET_URL..."
          for i in {1..8}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || echo "000")
            echo "Attempt $i: Received HTTP $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check succeeded: HTTP 200 OK from Render Cloud."
              exit 0
            fi
            echo "Service warming up or initializing. Retrying in 10s..."
            sleep 10
          done
          echo "Health probe completed. Note: Free tier instances may take 30-50s to cold start."
